<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Gestão — Plataforma</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
:root{--navy:#0C2340;--orange:#E8641A;--green:#27AE60;--purple:#7C3AED;--blue:#2563EB;--red:#EF4444;--yellow:#D97706;--teal:#0891B2;--bg:#F1F3F7;--white:#fff;--border:#D1D9E0;--text:#1E293B;--muted:#64748B;--light:#F8FAFC}
body{background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
.app{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sidebar{width:220px;background:var(--navy);flex-shrink:0;display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.15)}
.slogo{padding:20px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.slogo img{height:34px;width:auto;display:block}
.sstats{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:6px;flex-wrap:wrap}
.spill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.spill.g{background:rgba(39,174,96,.22);color:#86EFAC}
.spill.o{background:rgba(232,100,26,.22);color:#FCA5A5}
.snav{flex:1;padding:8px 0;overflow-y:auto}
.nitem{display:flex;align-items:center;gap:10px;padding:12px 18px;color:rgba(255,255,255,.5);font-size:13px;cursor:pointer;transition:.15s;border-left:3px solid transparent}
.nitem:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.nitem.active{background:rgba(232,100,26,.15);color:#fff;font-weight:600;border-left-color:var(--orange)}
.nitem i{font-size:17px;flex-shrink:0}
.sfooter{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:rgba(255,255,255,.2)}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.topbar h1{font-size:17px;font-weight:700;color:var(--navy)}
.tdate{font-size:12px;color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:24px 28px}
/* BUTTONS ── high contrast, always visible */
.btn{border:none;border-radius:8px;padding:9px 18px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(232,100,26,.35)}
.btn-primary:hover{background:#c85a10;transform:translateY(-1px);box-shadow:0 4px 12px rgba(232,100,26,.4)}
.btn-ghost{background:#fff;border:2px solid #94A3B8;color:#374151}
.btn-ghost:hover{border-color:var(--navy);color:var(--navy);background:#F0F4FF}
.btn-danger{background:#FEE2E2;color:#991B1B;border:2px solid #FCA5A5}
.btn-danger:hover{background:#FECACA;border-color:var(--red);color:var(--red)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px}
/* Icon-only action buttons — always visible */
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:2px solid #CBD5E1;background:#F8FAFC;color:#374151;cursor:pointer;font-size:15px;transition:.15s;flex-shrink:0}
.ibtn:hover{background:#EFF6FF;border-color:#3B82F6;color:#1D4ED8}
.ibtn.del{border-color:#FCA5A5;background:#FFF5F5;color:#991B1B}
.ibtn.del:hover{background:#FEE2E2;border-color:var(--red);color:var(--red)}
.ibtn.cpy{border-color:#BBF7D0;background:#F0FDF4;color:#166534}
.ibtn.cpy:hover{background:#DCFCE7;border-color:var(--green);color:var(--green)}
/* TAGS */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag.engajado{background:rgba(39,174,96,.15);color:#15803d}
.tag.emdia{background:rgba(37,99,235,.12);color:#1d4ed8}
.tag.atencao{background:rgba(232,100,26,.15);color:#c2410c}
.tag.ativo{background:rgba(39,174,96,.12);color:#15803d}
.tag.encerrado{background:rgba(239,68,68,.12);color:#b91c1c}
.tag.pausado{background:rgba(245,158,11,.12);color:#92400e}
.fbadge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}
/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.kcard{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-left:4px solid}
.kcard .kl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:7px;text-transform:uppercase;letter-spacing:.3px}
.kcard .kv{font-size:26px;font-weight:800;line-height:1.1}
.kcard .ks{font-size:11px;color:var(--muted);margin-top:5px}
/* CHARTS */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.cwrap{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.ctitle{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:14px}
.cbox{position:relative;height:200px}
/* FILTERS */
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.swrap{position:relative;flex:1;min-width:180px}
.swrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.sinput{width:100%;padding:9px 14px 9px 36px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-family:'Poppins',sans-serif;outline:none;color:var(--text);background:#fff;transition:.15s}
.sinput:focus{border-color:var(--orange)}
.fsel{padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:12px;font-family:'Poppins',sans-serif;color:var(--text);outline:none;background:#fff;transition:.15s;cursor:pointer}
.fsel:focus{border-color:var(--orange)}
.fdate{padding:7px 10px;border:2px solid var(--border);border-radius:8px;font-size:12px;font-family:'Poppins',sans-serif;outline:none;background:#fff;cursor:pointer}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.5px;background:#F1F5F9;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;transition:.1s}
.tbl th:hover{color:var(--navy)}
.tbl th.sorted{color:var(--orange)}
.tbl td{padding:10px 12px;border-bottom:1px solid #E8EEF4;vertical-align:middle;white-space:nowrap}
.tbl tr:hover td{background:#F8FBFF;cursor:pointer}
.tbl tr.sel td{background:#FFF5EF}
/* OVERLAY / MODAL */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 24px 64px rgba(0,0,0,.22)}
.modal-h{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:20px;display:flex;align-items:center;gap:8px;padding-bottom:16px;border-bottom:2px solid var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fg label{font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{padding:9px 12px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-family:'Poppins',sans-serif;color:var(--text);outline:none;transition:.15s;background:#fff}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,100,26,.1)}
.fg textarea{resize:vertical;min-height:80px}
.mfooter{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:2px solid var(--border)}
/* DETAIL PANEL */
.dp{position:fixed;top:0;right:0;bottom:0;width:480px;background:#fff;box-shadow:-8px 0 32px rgba(0,0,0,.14);z-index:90;display:flex;flex-direction:column;overflow:hidden}
.dp-hdr{padding:18px 20px 14px;background:var(--navy);color:#fff;flex-shrink:0}
.dp-hdr h3{font-size:15px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-tabs{display:flex;border-bottom:2px solid var(--border);background:#fff;flex-shrink:0}
.dp-tab{flex:1;padding:11px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;transition:.15s;color:#64748B;text-transform:uppercase;letter-spacing:.3px}
.dp-tab.active{color:var(--orange);border-bottom-color:var(--orange);background:#FFF9F6}
.dp-body{flex:1;overflow-y:auto;padding:16px 18px}
.dp-footer{padding:12px 18px;border-top:2px solid var(--border);display:flex;gap:8px;background:#F8FAFC;flex-shrink:0}
.cbtn{background:rgba(255,255,255,.18);border:none;color:#fff;width:28px;height:28px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.15s;flex-shrink:0}
.cbtn:hover{background:rgba(255,255,255,.32)}
/* PHASE TRACK */
.phtrk{display:flex;position:relative;margin-bottom:18px}
.phstep{flex:1;text-align:center;position:relative}
.phdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin:0 auto 4px;border:2px solid}
.phlbl{font-size:9px;font-weight:600}
/* INFO */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.iitem{background:var(--light);border-radius:8px;padding:9px 12px;border:1px solid #E8EEF4}
.iitem .ik{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.iitem .iv{font-size:13px;font-weight:600;color:var(--navy)}
.stitle{font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--border)}
/* CHECKLIST */
.chkacc{border:2px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px;transition:.15s}
.chkacc:hover{border-color:#CBD5E1}
.chkhdr{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;cursor:pointer;background:var(--light);transition:.15s;user-select:none}
.chkhdr:hover{background:#EFF6FF}
.chkbody{padding:8px 13px 12px}
.chtask{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #F1F5F9}
.chtask:last-of-type{border-bottom:none}
.chtask input[type=checkbox]{flex-shrink:0;width:16px;height:16px;accent-color:var(--green);cursor:pointer;margin-top:1px}
.chtask .td{flex:1;font-size:12px;color:var(--text);line-height:1.4;word-break:break-word}
.chtask .td.done{text-decoration:line-through;color:var(--muted)}
.chtask .tp{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0;border:1.5px solid}
.chtask .tp.empty{background:#F1F5F9;color:#64748B;border-color:#CBD5E1}
.chtask .tbtns{display:flex;gap:3px;flex-shrink:0}
.chtask .tbtns button{background:var(--light);border:1.5px solid #D1D9E0;cursor:pointer;padding:4px 6px;border-radius:6px;color:#374151;font-size:13px;display:flex;align-items:center;transition:.15s}
.chtask .tbtns button:hover{background:#EFF6FF;border-color:#3B82F6;color:#1D4ED8}
.chtask .tbtns button.del:hover{background:#FEE2E2;border-color:var(--red);color:var(--red)}
.addtask{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed #CBD5E1;align-items:center}
.addtask input{flex:1;padding:7px 10px;border:2px solid var(--border);border-radius:7px;font-size:12px;font-family:'Poppins',sans-serif;outline:none;min-width:0;transition:.15s}
.addtask input:focus{border-color:var(--orange)}
.addtask select{padding:7px 8px;border:2px solid var(--border);border-radius:7px;font-size:12px;font-family:'Poppins',sans-serif;outline:none;background:#fff;cursor:pointer}
/* KANBAN */
.kanban{display:flex;gap:12px;overflow-x:auto;height:calc(100vh - 200px);padding-bottom:10px}
.kcol{width:230px;flex-shrink:0;display:flex;flex-direction:column}
.khdr{padding:12px 14px;border-radius:10px 10px 0 0;color:#fff;display:flex;align-items:center;justify-content:space-between}
.knum{font-size:26px;font-weight:800;opacity:.95}
.kbody{flex:1;overflow-y:auto;padding:8px;background:var(--light);border-radius:0 0 10px 10px;border:2px solid var(--border);border-top:none}
.kcard{background:#fff;border-radius:9px;padding:11px 12px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.07);cursor:pointer;transition:.15s;border-left:3px solid}
.kcard:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.1)}
.kcname{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:5px}
.kmove{display:flex;gap:4px;margin-top:7px;padding-top:6px;border-top:1px solid #E8EEF4}
.kmove button{flex:1;font-size:10px;padding:5px 6px;border-radius:6px;border:2px solid #CBD5E1;background:#fff;cursor:pointer;color:#374151;font-family:'Poppins',sans-serif;font-weight:700;transition:.15s}
.kmove button:hover{border-color:var(--navy);color:var(--navy);background:#EFF6FF}
/* REPO */
.rcats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.rcat{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;border:2px solid var(--border);background:#fff;cursor:pointer;transition:.15s;color:#374151}
.rcat:hover,.rcat.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rcard{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;transition:.15s;border-top:3px solid var(--navy)}
.rcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.11)}
.rct{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:6px}
.rex{font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* TIME */
.tlayout{display:grid;grid-template-columns:1fr 320px;gap:18px}
.mcard{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:12px;overflow:hidden;border:2px solid transparent;transition:.15s}
.mcard:hover{border-color:#E2E8F0}
.mchdr{display:flex;gap:10px;padding:14px 16px;align-items:flex-start}
.minfo{flex:1;cursor:pointer;min-width:0}
.macts{display:flex;align-items:center;gap:6px;flex-shrink:0;padding-top:2px}
.mbody{padding:0 16px 14px;border-top:1px solid var(--border)}
.arow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:12px}
.arow:last-child{border-bottom:none}
.adesc{flex:1;color:var(--text)}
.aresp{color:var(--orange);font-weight:700;min-width:52px;font-size:11px}
.ast{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;border:1.5px solid}
.ast.done{background:#DCFCE7;color:#15803d;border-color:#86EFAC}
.ast.pend{background:#FEF3C7;color:#92400e;border-color:#FDE68A}
.ast.prog{background:#DBEAFE;color:#1d4ed8;border-color:#93C5FD}
.gcard{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:12px;border:2px solid transparent;transition:.15s}
.gcard:hover{border-color:#E2E8F0}
.gbar{background:#E8EEF4;border-radius:20px;height:8px;overflow:hidden;margin:6px 0 4px}
.gfill{height:100%;border-radius:20px;transition:width .5s}
/* TOAST */
@keyframes tIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tIn .25s ease;display:flex;align-items:center;gap:8px}
/* MISC */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#F1F5F9}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.prow{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.prow label{font-size:12px;font-weight:700;color:var(--muted)}
.prow select{padding:7px 10px;border:2px solid var(--border);border-radius:8px;font-size:12px;font-family:'Poppins',sans-serif;color:var(--navy);font-weight:600;outline:none;cursor:pointer}
.ecol{text-align:center;padding:20px 10px;color:var(--muted);font-size:12px}
.bdone{background:#DCFCE7;color:#15803d;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700;border:1.5px solid #86EFAC}
.bpart{background:#FEF3C7;color:#92400e;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700;border:1.5px solid #FDE68A}
input[type=checkbox]{accent-color:var(--green);cursor:pointer}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}

.pgloader{position:fixed;inset:0;background:#0C2340;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pgloader img{height:42px;opacity:.9}
.lballs{display:flex;gap:7px}
.lball{width:9px;height:9px;border-radius:50%;background:#E8641A;animation:lb .85s ease-in-out infinite}
.lball:nth-child(2){animation-delay:.17s}.lball:nth-child(3){animation-delay:.34s}
@keyframes lb{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.pgloader p{color:rgba(255,255,255,.45);font-size:12px;margin:0}
.pgloader .err-box{text-align:center;padding:24px;color:#fff}
.pgloader .err-box i{font-size:44px;color:#EF4444;display:block;margin-bottom:12px}
.pgloader .err-box h3{font-size:16px;font-weight:700;margin-bottom:6px}
.pgloader .err-box p{opacity:.6;font-size:12px}
.syncdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:.3s}
.syncdot.ok{background:#27AE60;box-shadow:0 0 6px #27AE60}
.syncdot.err{background:#EF4444;box-shadow:0 0 6px #EF4444}
.syncdot.wait{background:#F59E0B;box-shadow:0 0 6px #F59E0B;animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>
<body>
<div class="pgloader" id="pgLoader"><div class="lballs"><div class="lball"></div><div class="lball"></div><div class="lball"></div></div><p>Conectando ao banco de dados...</p></div>

function rDash(mc){
  const y=S.selY,m=S.selM;
  const acts=S.clients.filter(c=>isAM(c,y,m));
  const cans=S.clients.filter(c=>isClM(c,y,m));
  const fat=acts.reduce((s,c)=>s+(c.plano||0),0);
  const pM=m===0?11:m-1,pY=m===0?y-1:y;
  const prev=S.clients.filter(c=>isAM(c,pY,pM)).length;
  const churn=prev>0?cans.length/prev*100:0;
  const allA=S.clients.filter(c=>c.st==='Ativo');
  const avgM=allA.length?allA.reduce((s,c)=>s+(c.mes||0),0)/allA.length:0;
  const avgT=allA.length?allA.reduce((s,c)=>s+(c.plano||0),0)/allA.length:0;
  const disc=acts.filter(c=>c.desc).length;
  const kpis=[{l:'Projetos Ativos',v:acts.length,s:'no período',c:NAVY,i:'ti-building'},{l:'Cancelamentos',v:cans.length,s:'no período',c:RD,i:'ti-x'},{l:'Faturamento',v:brl(fat),s:'soma dos planos ativos',c:GR,i:'ti-coin'},{l:'Churn',v:pp(churn),s:`${cans.length} enc. / ${prev} at. mês ant.`,c:OG,i:'ti-trending-down'},{l:'LTV do Ano',v:brl(avgM*avgT),s:`${avgM.toFixed(1)}m × ${brl(avgT)}`,c:PU,i:'ti-trending-up'},{l:'Com Desconto',v:disc,s:'clientes no período',c:YL,i:'ti-tag'}];
  const byFase=FASES.slice(1).map(f=>({f,n:acts.filter(c=>c.fase===f).length}));
  const byCon=['Andrade','Day'].map(c=>({c,n:acts.filter(x=>x.con===c).length}));
  const byTag=TAGS.map(t=>({t,n:acts.filter(c=>c.tag===t).length}));
  const bySeg={};acts.forEach(c=>{const s=(c.seg||'Outro').split('/')[0];bySeg[s]=(bySeg[s]||0)+1;});
  const bSA=Object.entries(bySeg).map(([s,n])=>({s,n}));
  const ann=MMS.map((mes,mi)=>({mes,ativos:S.clients.filter(c=>isAM(c,y,mi)).length,novos:S.clients.filter(c=>isNwM(c,y,mi)).length,encerrados:S.clients.filter(c=>isClM(c,y,mi)).length,meta:y===2026?META26[mi]:0}));
  mc.innerHTML=`
  <div class="prow"><label>Período:</label>
    <select onchange="S.selM=+this.value;rDash(document.getElementById('main'))">${MMS.map((mm,i)=>`<option value="${i}"${i===S.selM?' selected':''}>${mm}</option>`).join('')}</select>
    <select onchange="S.selY=+this.value;rDash(document.getElementById('main'))">${[2025,2026].map(yy=>`<option${yy===S.selY?' selected':''}>${yy}</option>`).join('')}</select>
  </div>
  <div class="kgrid">${kpis.map(k=>`<div class="kcard" style="border-left-color:${k.c}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><span class="kl">${k.l}</span><i class="ti ${k.i}" style="font-size:22px;color:${k.c}"></i></div><div class="kv" style="color:${k.c}">${k.v}</div><div class="ks">${k.s}</div></div>`).join('')}</div>
  <div class="cgrid"><div class="cwrap"><div class="ctitle">Clientes por Fase</div><div class="cbox"><canvas id="chF"></canvas></div></div><div class="cwrap"><div class="ctitle">Clientes por Consultor</div><div class="cbox"><canvas id="chC"></canvas></div></div></div>
  <div class="cgrid" style="margin-bottom:14px"><div class="cwrap"><div class="ctitle">Clientes por Tag</div><div class="cbox"><canvas id="chT"></canvas></div></div><div class="cwrap"><div class="ctitle">Clientes por Segmento</div><div class="cbox"><canvas id="chS"></canvas></div></div></div>
  <div class="cwrap"><div class="ctitle">Evolução Anual ${y} — calculado da base real (passe o mouse para ver detalhes)</div><div class="cbox" style="height:230px"><canvas id="chA"></canvas></div></div>`;
  const bOpts={responsive:true,maintainAspectRatio:false,animation:false,layout:{padding:{top:22}},plugins:{legend:{position:'bottom',labels:{font:{family:'Poppins',size:11},boxWidth:10,padding:10}},tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label||''}: ${ctx.parsed.y}`}}},scales:{x:{grid:{display:false},border:{display:false},ticks:{font:{family:'Poppins',size:11},color:'#64748B'}},y:{grid:{display:false},border:{display:false},ticks:{font:{family:'Poppins',size:11},color:'#64748B'},title:{display:true,text:'Qtd',font:{family:'Poppins',size:10},color:'#94A3B8'}}}};
  let dlN=0;
  function mkBar(id,labels,data,colors){
    const ctx=document.getElementById(id);if(!ctx)return;
    const ch=new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Clientes',data,backgroundColor:colors,borderRadius:8,borderSkipped:false}]},options:JSON.parse(JSON.stringify(bOpts))});
    S.charts[id]=ch;
    const pid='dl'+(dlN++);
    Chart.register({id:pid,afterDatasetsDraw(c){const{ctx:cx}=c;cx.save();c.data.datasets.forEach((ds,i)=>{c.getDatasetMeta(i).data.forEach((el,j)=>{const v=ds.data[j];if(!v)return;cx.font='700 11px Poppins';cx.textAlign='center';cx.textBaseline='bottom';cx.fillStyle=Array.isArray(ds.backgroundColor)?ds.backgroundColor[j]:NAVY;cx.fillText(v,el.x,el.y-4);});});cx.restore();}});
  }
  mkBar('chF',byFase.map(x=>x.f),byFase.map(x=>x.n),byFase.map(x=>FC[x.f]||OG));
  mkBar('chC',byCon.map(x=>x.c),byCon.map(x=>x.n),byCon.map(x=>CC[x.c]||NAVY));
  mkBar('chT',byTag.map(x=>x.t),byTag.map(x=>x.n),byTag.map(x=>TC[x.t]||OG));
  mkBar('chS',bSA.map(x=>x.s),bSA.map(x=>x.n),bSA.map((_,i)=>SC[i%SC.length]));
  const cA=document.getElementById('chA');
  if(cA){S.charts.chA=new Chart(cA,{type:'line',data:{labels:ann.map(d=>d.mes),datasets:[{label:'Meta',data:ann.map(d=>d.meta),borderColor:'#CBD5E1',borderDash:[5,3],pointRadius:3,tension:.3,borderWidth:1.5,pointBackgroundColor:'#CBD5E1',fill:false},{label:'Ativos',data:ann.map(d=>d.ativos),borderColor:NAVY,pointRadius:5,pointHoverRadius:7,tension:.3,borderWidth:2.5,pointBackgroundColor:NAVY,fill:false},{label:'Encerrados',data:ann.map(d=>d.encerrados),borderColor:OG,pointRadius:4,pointHoverRadius:6,tension:.3,borderWidth:2,pointBackgroundColor:OG,fill:false},{label:'Novos',data:ann.map(d=>d.novos),borderColor:GR,pointRadius:4,pointHoverRadius:6,tension:.3,borderWidth:2,pointBackgroundColor:GR,fill:false}]},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{font:{family:'Poppins',size:11},boxWidth:10,padding:10}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{display:false},border:{display:false},ticks:{font:{family:'Poppins',size:11}}},y:{grid:{display:false},border:{display:false},ticks:{font:{family:'Poppins',size:11}},title:{display:true,text:'Clientes',font:{family:'Poppins',size:10},color:'#94A3B8'}}}}});}
}

// ── CLIENTES ───────────────────────────────────────────────
function sortC(col){if(S.cs.col===col){S.cs.dir=S.cs.dir==='asc'?'desc':'asc';}else{S.cs={col,dir:'asc'};}rClients(document.getElementById('main'));}
function rClients(mc){
  const f=S.cf;
  let list=S.clients.filter(c=>{
    if(f.st&&c.st!==f.st)return false;if(f.fase&&c.fase!==f.fase)return false;if(f.con&&c.con!==f.con)return false;if(f.tag&&c.tag!==f.tag)return false;if(f.q&&!c.nome.toLowerCase().includes(f.q.toLowerCase()))return false;if(f.df&&c.di&&c.di<f.df)return false;if(f.dt&&c.di&&c.di>f.dt)return false;return true;
  });
  const sF={nome:(a,b)=>a.nome.localeCompare(b.nome,'pt-BR'),plano:(a,b)=>a.plano-b.plano,mes:(a,b)=>a.mes-b.mes,di:(a,b)=>(a.di||'').localeCompare(b.di||''),de:(a,b)=>(a.de||'').localeCompare(b.de||''),con:(a,b)=>a.con.localeCompare(b.con,'pt-BR'),fase:(a,b)=>FASES.indexOf(a.fase)-FASES.indexOf(b.fase)};
  if(sF[S.cs.col])list=list.sort((a,b)=>S.cs.dir==='asc'?sF[S.cs.col](a,b):-sF[S.cs.col](a,b));
  function th(col,lbl){const a=S.cs.col===col,ic=a?(S.cs.dir==='asc'?'↑':'↓'):'↕';return `<th class="${a?'sorted':''}" onclick="sortC('${col}')">${lbl}&nbsp;<span style="opacity:${a?1:.3};color:${a?OG:'inherit'}">${ic}</span></th>`;}
  mc.innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <span style="font-size:13px;color:var(--muted);font-weight:600">${list.length} cliente(s)</span>
    <button class="btn btn-primary" onclick="openNC()"><i class="ti ti-plus"></i>Novo Cliente</button>
  </div>
  <div class="fbar" style="margin-bottom:10px">
    <div class="swrap"><i class="ti ti-search"></i><input class="sinput" placeholder="Buscar cliente..." value="${f.q}" oninput="S.cf.q=this.value;rClients(document.getElementById('main'))"></div>
    <select class="fsel" onchange="S.cf.st=this.value;rClients(document.getElementById('main'))"><option value="">Todos status</option>${STS.map(x=>`<option${f.st===x?' selected':''}>${x}</option>`).join('')}</select>
    <select class="fsel" onchange="S.cf.fase=this.value;rClients(document.getElementById('main'))"><option value="">Todas fases</option>${FASES.map(x=>`<option${f.fase===x?' selected':''}>${x}</option>`).join('')}</select>
    <select class="fsel" onchange="S.cf.con=this.value;rClients(document.getElementById('main'))"><option value="">Todos consult.</option>${['Andrade','Day'].map(x=>`<option${f.con===x?' selected':''}>${x}</option>`).join('')}</select>
    <select class="fsel" onchange="S.cf.tag=this.value;rClients(document.getElementById('main'))"><option value="">Todas tags</option>${TAGS.map(x=>`<option${f.tag===x?' selected':''}>${x}</option>`).join('')}</select>
  </div>
  <div class="fbar" style="margin-bottom:16px">
    <label style="font-size:12px;color:var(--muted);font-weight:700">Início de:</label>
    <input type="date" class="fdate" value="${f.df}" onchange="S.cf.df=this.value;rClients(document.getElementById('main'))">
    <label style="font-size:12px;color:var(--muted);font-weight:700">até</label>
    <input type="date" class="fdate" value="${f.dt}" onchange="S.cf.dt=this.value;rClients(document.getElementById('main'))">
    ${f.df||f.dt?`<button class="btn btn-ghost btn-sm" onclick="S.cf.df='';S.cf.dt='';rClients(document.getElementById('main'))">Limpar datas</button>`:''}
  </div>
  <div class="card" style="overflow-x:auto">
    <table class="tbl">
      <thead><tr>${th('nome','Cliente')}${th('seg','Segmento')}${th('plano','Plano')}${th('con','Consultor')}${th('fase','Fase')}<th>Tag</th><th>Status</th>${th('di','Início')}${th('de','Encerramento')}${th('mes','Meses')}<th>Checklist</th></tr></thead>
      <tbody id="ctb"></tbody>
    </table>
  </div>`;
  const tb=document.getElementById('ctb');
  if(!list.length){tb.innerHTML=`<tr><td colspan="11" style="text-align:center;padding:32px;color:var(--muted)">Nenhum cliente encontrado</td></tr>`;return;}
  tb.innerHTML=list.map(c=>{
    const p=chkP(c.id,c.fase);const fc=FC[c.fase]||OG;
    return `<tr class="${S.selC===c.id?'sel':''}" onclick="selC('${c.id}')">
      <td><strong style="color:var(--navy)">${c.nome}</strong>${c.desc?'<span style="font-size:9px;background:#FEF3C7;color:#92400e;padding:2px 6px;border-radius:10px;margin-left:6px;font-weight:700">desc</span>':''}</td>
      <td style="color:var(--muted);font-size:12px">${(c.seg||'—').split('/')[0]}</td>
      <td style="font-weight:700;font-size:12px">${brl(c.plano)}</td>
      <td><span style="font-size:11px;font-weight:700;color:${CC[c.con]||NAVY}">${c.con||'—'}</span></td>
      <td><span class="fbadge" style="background:${fc}">${c.fase||'—'}</span></td>
      <td><span class="tag ${tcl(c.tag)}">${c.tag||'—'}</span></td>
      <td><span class="tag ${scl(c.st)}">${c.st}</span></td>
      <td style="color:var(--muted);font-size:12px">${df(c.di)}</td>
      <td style="color:var(--muted);font-size:12px">${df(c.de)}</td>
      <td style="font-size:12px;color:var(--muted);font-weight:600">${c.mes||0}m</td>
      <td style="min-width:70px"><div style="font-size:10px;color:var(--muted);margin-bottom:2px;font-weight:600">${p}%</div><div style="background:#E8EEF4;border-radius:10px;height:5px"><div style="width:${p}%;height:100%;background:${fc};border-radius:10px"></div></div></td>
    </tr>`;
  }).join('');
}

// ── DETAIL PANEL ───────────────────────────────────────────
function selC(id){S.selC=id===S.selC?null:id;S.dtab='info';S.etid=null;if(S.selC)rDP();else{const p=document.getElementById('dpanel');if(p)p.remove();}rClients(document.getElementById('main'));}
function closeDP(){S.selC=null;const p=document.getElementById('dpanel');if(p)p.remove();}
function rDP(){
  const c=S.clients.find(x=>x.id===S.selC);if(!c)return;
  let panel=document.getElementById('dpanel');
  if(!panel){panel=document.createElement('div');panel.id='dpanel';panel.className='dp';document.body.appendChild(panel);}
  const fc=FC[c.fase]||OG;
  panel.innerHTML=`
    <div class="dp-hdr">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="min-width:0;flex:1"><h3>${c.nome}</h3><div style="font-size:11px;color:rgba(255,255,255,.6);margin-top:2px">${c.seg||''} · ${brl(c.plano)}/mês · ${c.mes||0} meses</div></div>
        <button class="cbtn" onclick="closeDP()"><i class="ti ti-x"></i></button>
      </div>
      <div style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap">
        <span class="tag ${tcl(c.tag)}" style="font-size:11px">${c.tag||'—'}</span>
        <span class="tag ${scl(c.st)}" style="font-size:11px">${c.st}</span>
        <span class="fbadge" style="background:${fc};font-size:11px">${c.fase||'—'}</span>
      </div>
    </div>
    <div class="dp-tabs">
      <div class="dp-tab${S.dtab==='info'?' active':''}" onclick="S.dtab='info';S.etid=null;rDPBody()">Informações</div>
      <div class="dp-tab${S.dtab==='chk'?' active':''}" onclick="S.dtab='chk';S.etid=null;rDPBody()">Checklist</div>
    </div>
    <div class="dp-body" id="dpb"></div>
    <div class="dp-footer">
      <button class="btn btn-primary btn-sm" onclick="openEC('${c.id}')"><i class="ti ti-edit"></i>Editar</button>
      <button class="btn btn-ghost btn-sm" onclick="closeDP()">Fechar</button>
      <button class="btn btn-danger btn-sm" style="margin-left:auto" onclick="delC('${c.id}')"><i class="ti ti-trash"></i>Excluir</button>
    </div>`;
  rDPBody();
}
function rDPBody(){
  const c=S.clients.find(x=>x.id===S.selC);if(!c)return;
  const body=document.getElementById('dpb');if(!body)return;
  if(S.dtab==='info'){
    const pi=FASES.indexOf(c.fase);
    const trk=FASES.map((f,i)=>{const cl=FC[f];const dn=i<pi,cr=i===pi;return `<div class="phstep"><div class="phdot" style="background:${cr?cl:dn?cl:'#E8EEF4'};border-color:${dn||cr?cl:'#D1D9E0'};color:${dn||cr?'#fff':'#94A3B8'}">${dn?'✓':i+1}</div><div class="phlbl" style="color:${cr?cl:'#94A3B8'}">${f}</div>${i<FASES.length-1?`<div style="position:absolute;top:12px;left:50%;width:100%;height:2px;background:${dn?cl:'#E2E8F0'}"></div>`:''}</div>`;}).join('');
    body.innerHTML=`<div class="stitle">Jornada</div><div class="phtrk" style="position:relative;margin-bottom:18px">${trk}</div>
    <div class="stitle">Dados</div>
    <div class="igrid">
      <div class="iitem"><div class="ik">Consultor</div><div class="iv">${c.con||'—'}</div></div>
      <div class="iitem"><div class="ik">Plano</div><div class="iv">${brl(c.plano)}/mês</div></div>
      <div class="iitem"><div class="ik">Segmento</div><div class="iv">${(c.seg||'—').split('/')[0]}</div></div>
      <div class="iitem"><div class="ik">Fat. Mensal</div><div class="iv">${brl(c.fat||0)}</div></div>
      <div class="iitem"><div class="ik">Início</div><div class="iv">${df(c.di)}</div></div>
      <div class="iitem"><div class="ik">Encerramento</div><div class="iv">${df(c.de)}</div></div>
      <div class="iitem"><div class="ik">Meses Ativo</div><div class="iv">${c.mes||0}</div></div>
      <div class="iitem"><div class="ik">NPS</div><div class="iv">${c.nps||'—'}</div></div>
    </div>
    ${c.obs?`<div class="stitle">Observações</div><p style="font-size:12px;color:var(--muted);line-height:1.5">${c.obs}</p>`:''}
    ${c.motivo?`<div class="stitle" style="margin-top:10px">Motivo Encerramento</div><p style="font-size:12px;color:var(--red);font-weight:600">${c.motivo}</p>`:''}`;
  } else {
    const tasks=gChk(c.id);
    body.innerHTML=`<div class="stitle">Checklist — todas as fases</div>`+
    FASES.map(fase=>{
      const ft=tasks.filter(t=>t.fase===fase);
      const dn=ft.filter(t=>t.done).length,tot=ft.length;
      const fc=FC[fase]||OG;const isCur=fase===c.fase;
      const key=c.id+'_'+sid(fase);
      const exp=S.chkx[key]!==false;
      const p=tot?Math.round(dn/tot*100):0;
      return `<div class="chkacc" style="${isCur?`border-color:${fc};border-width:2px`:''}">
        <div class="chkhdr" onclick="togCA('${key}')">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="width:9px;height:9px;border-radius:50%;background:${fc};flex-shrink:0"></span>
            <span style="font-size:13px;font-weight:700;color:${isCur?fc:'#1E293B'}">${fase}</span>
            ${isCur?`<span style="background:${fc}22;color:${fc};font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1.5px solid ${fc}44">Fase atual</span>`:''}
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:11px;color:var(--muted);font-weight:600">${dn}/${tot} · ${p}%</span>
            <div style="width:40px;height:5px;background:#E8EEF4;border-radius:10px"><div style="width:${p}%;height:100%;background:${fc};border-radius:10px"></div></div>
            <i class="ti ti-chevron-${exp?'up':'down'}" style="font-size:14px;color:#64748B"></i>
          </div>
        </div>
        ${exp?`<div class="chkbody">
          ${ft.length===0?'<div style="font-size:12px;color:var(--muted);padding:8px 0;font-style:italic">Nenhuma tarefa — adicione abaixo</div>':''}
          ${ft.map(t=>{
            if(S.etid===t.id){return `<div class="chtask" style="background:#FFF9F6;border-radius:6px;padding:6px 0">
              <input type="checkbox" ${t.done?'checked':''} onchange="togT('${c.id}','${t.id}')">
              <input type="text" id="etd_${t.id}" value="${t.desc.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}" style="flex:1;padding:6px 9px;border:2px solid ${OG};border-radius:7px;font-size:12px;font-family:Poppins,sans-serif;outline:none">
              <select id="etp_${t.id}" style="padding:6px 8px;border:2px solid var(--border);border-radius:7px;font-size:11px;font-family:Poppins,sans-serif;background:#fff">
                <option value="">— A definir —</option>
                ${CONS.map(p=>`<option${t.person===p?' selected':''}>${p}</option>`).join('')}
              </select>
              <div class="tbtns">
                <button onclick="svET('${c.id}','${t.id}')" style="color:${GR}"><i class="ti ti-check"></i></button>
                <button onclick="S.etid=null;rDPBody()"><i class="ti ti-x"></i></button>
              </div>
            </div>`;}
            return `<div class="chtask">
              <input type="checkbox" ${t.done?'checked':''} onchange="togT('${c.id}','${t.id}')">
              <span class="td${t.done?' done':''}">${t.desc}</span>
              ${personBadge(t.person)}
              <div class="tbtns">
                <button onclick="S.etid='${t.id}';rDPBody()" title="Editar"><i class="ti ti-edit"></i></button>
                <button class="del" onclick="delT('${c.id}','${t.id}')" title="Excluir"><i class="ti ti-trash"></i></button>
              </div>
            </div>`;
          }).join('')}
          <div class="addtask">
            <input id="nt_${key}" placeholder="Nova tarefa...">
            <select id="np_${key}">
              <option value="">— A definir —</option>
              ${CONS.map(p=>`<option>${p}</option>`).join('')}
            </select>
            <button class="btn btn-primary btn-sm" onclick="addT('${c.id}','${fase}','${key}')"><i class="ti ti-plus"></i>Add</button>
          </div>
        </div>`:''}</div>`;
    }).join('');
  }
}
function togCA(k){S.chkx[k]=S.chkx[k]!==false?false:true;rDPBody();}
function togT(cid,tid){const t=gChk(cid).find(x=>x.id===tid);if(t){t.done=!t.done;sv('pgCHK',S.chk);rDPBody();rClients(document.getElementById('main'));}}
function addT(cid,fase,key){
  const di=document.getElementById('nt_'+key),pi=document.getElementById('np_'+key);
  if(!di||!di.value.trim()){toast('Digite a descrição da tarefa',false);return;}
  const t=gChk(cid);t.push({id:uid(),fase,desc:di.value.trim(),person:pi.value,done:false});
  sv('pgCHK',S.chk);toast('Tarefa adicionada');rDPBody();
}

function clCM(){const m=document.getElementById('cMod');if(m)m.remove();}
function svC(){
  const g=i=>document.getElementById(i);const nome=g('fn').value.trim();if(!nome){toast('Nome obrigatório',false);return;}
  const c={id:S.editC?S.editC.id:uid(),nome,seg:g('fsg').value,plano:+g('fpl').value||1499,con:g('fco').value,st:g('fst').value,fase:g('ffa').value,tag:g('ftg').value,desc:g('fdc').checked,di:g('fdi').value,de:g('fde').value||null,mes:+g('fme').value||0,nps:+g('fnp').value||null,fat:+g('fft').value||0,obs:g('fob').value,motivo:g('fmo').value||''};

  rSidebar();const mc=document.getElementById('main');

// ── FLUXO ──────────────────────────────────────────────────
function rFluxo(mc){
  const ff=S.ff;
  const all=S.clients.filter(c=>c.st==='Ativo'||c.st==='Pausado');
  const vis=all.filter(c=>{if(ff.tag&&c.tag!==ff.tag)return false;if(ff.con&&c.con!==ff.con)return false;if(ff.st&&c.st!==ff.st)return false;return true;});
  mc.innerHTML=`
  <div class="fbar" style="margin-bottom:14px">
    <select class="fsel" onchange="S.ff.tag=this.value;rFluxo(document.getElementById('main'))"><option value="">Todas tags</option>${TAGS.map(x=>`<option${ff.tag===x?' selected':''}>${x}</option>`).join('')}</select>
    <select class="fsel" onchange="S.ff.con=this.value;rFluxo(document.getElementById('main'))"><option value="">Todos consultores</option>${['Andrade','Day'].map(x=>`<option${ff.con===x?' selected':''}>${x}</option>`).join('')}</select>
    <select class="fsel" onchange="S.ff.st=this.value;rFluxo(document.getElementById('main'))"><option value="">Ativo + Pausado</option>${STS.map(x=>`<option${ff.st===x?' selected':''}>${x}</option>`).join('')}</select>
    <span style="font-size:12px;color:var(--muted);font-weight:600">${vis.length} exibido(s)</span>
  </div>
  <div class="kanban" id="kboard"></div>`;
  const kb=document.getElementById('kboard');
  FASES.forEach(fase=>{
    const tot=all.filter(c=>c.fase===fase).length;
    const vl=vis.filter(c=>c.fase===fase);
    const avgM=tot?Math.round(all.filter(c=>c.fase===fase).reduce((s,c)=>s+(c.mes||0),0)/tot):0;
    const col=document.createElement('div');col.className='kcol';
    col.innerHTML=`<div class="khdr" style="background:${FC[fase]||OG}"><div><div style="font-size:12px;font-weight:700">${fase}</div><div style="font-size:10px;opacity:.7">${avgM}m média</div></div><div style="text-align:right"><div class="knum">${tot}</div><div style="font-size:10px;opacity:.7">clientes</div></div></div><div class="kbody" id="kb_${sid(fase)}">${vl.length===0?`<div class="ecol"><i class="ti ti-inbox" style="font-size:22px;display:block;margin-bottom:4px"></i>${tot>0?'Filtrado':'Vazio'}</div>`:''}</div>`;
    kb.appendChild(col);
    const body=col.querySelector('.kbody');
    vl.forEach(c=>{
      const idx=FASES.indexOf(c.fase);
      const card=document.createElement('div');card.className='kcard';card.style.borderLeftColor=TC[c.tag]||OG;
      card.innerHTML=`<div class="kcname">${c.nome}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><span class="tag ${tcl(c.tag)}" style="font-size:10px">${c.tag}</span><span style="font-size:11px;font-weight:700;color:${CC[c.con]||NAVY}">${c.con}</span></div>
        <div style="font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center">${c.mes||0}m${c.st==='Pausado'?' · <span style="color:'+YL+';font-weight:600">Pausado</span>':''}${c.desc?' <span style="background:#FEF3C7;color:#92400e;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700">desc</span>':''}</div>
        <div class="kmove">${idx>0?`<button onclick="mvF('${c.id}',-1,event)">← ${FASES[idx-1]}</button>`:''}${idx<FASES.length-1?`<button onclick="mvF('${c.id}',1,event)">${FASES[idx+1]} →</button>`:''}</div>`;
      card.onclick=()=>{S.selC=c.id;S.dtab='info';S.etid=null;rDP();};
      body.appendChild(card);
    });
  });
}
function mvF(id,dir,e){e.stopPropagation();const c=S.clients.find(x=>x.id===id);if(!c)return;const ni=FASES.indexOf(c.fase)+dir;if(ni<0||ni>=FASES.length)return;c.fase=FASES[ni];sv('pgC',S.clients);rFluxo(document.getElementById('main'));rSidebar();if(S.selC===id)rDP();}

    ${S.rs?`<button class="btn btn-ghost btn-sm" onclick="S.rs='';rRepo(document.getElementById('main'))">Limpar</button>`:''}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px" onclick="event.stopPropagation()">
        <span style="font-size:11px;color:#94A3B8">${df(r.data)}</span>
        <div style="display:flex;gap:6px">
          <button class="ibtn cpy" onclick="cpR('${r.id}')" title="Copiar conteúdo"><i class="ti ti-copy"></i></button>
          <button class="ibtn del" onclick="dlR('${r.id}')" title="Excluir"><i class="ti ti-trash"></i></button>

function openNR(){S.editR=null;mkRM();}
function openER(id){S.editR=S.repo.find(r=>r.id===id)||null;mkRM();}
function dlR(id){if(!confirm('Excluir item?'))return;S.repo=S.repo.filter(r=>r.id!==id);sv('pgR',S.repo);toast('Item excluído');rRepo(document.getElementById('main'));}
function cpR(id){const r=S.repo.find(x=>x.id===id);if(r)navigator.clipboard.writeText(r.conteudo).then(()=>toast('Conteúdo copiado!'));}
function mkRM(){
  const r=S.editR||{};let m=document.getElementById('rMod');
  if(!m){m=document.createElement('div');m.className='overlay';m.id='rMod';m.onclick=function(e){if(e.target===this)clRM();};document.body.appendChild(m);}
  m.innerHTML=`<div class="modal"><div class="modal-h"><i class="ti ti-file-text" style="color:${OG}"></i>${r.id?'Editar Item':'Novo Item'}</div>
    <div class="fg"><label>Categoria</label><select id="rct">${RCATS.map(cat=>`<option${(r.cat||S.rcat)===cat?' selected':''}>${cat}</option>`).join('')}</select></div>
    <div class="fg"><label>Título*</label><input id="rti" value="${r.titulo||''}" placeholder="Título do item"></div>
    <div class="fg"><label>Conteúdo*</label><textarea id="rco" style="min-height:150px">${r.conteudo||''}</textarea></div>

}
function clRM(){const m=document.getElementById('rMod');if(m)m.remove();}
function svR(){
  const t=document.getElementById('rti').value.trim(),co=document.getElementById('rco').value.trim();
  if(!t||!co){toast('Preencha título e conteúdo',false);return;}
  const item={id:S.editR?S.editR.id:uid(),cat:document.getElementById('rct').value,titulo:t,conteudo:co,data:new Date().toISOString().slice(0,10)};
  if(S.editR){S.repo=S.repo.map(r=>r.id===item.id?item:r);}else{S.repo.push(item);}
  sv('pgR',S.repo);clRM();toast(S.editR?'Item atualizado':'Item adicionado');rRepo(document.getElementById('main'));

// ── TIME ───────────────────────────────────────────────────
function rTime(mc){
  mc.innerHTML=`<div class="tlayout">
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="font-size:15px;font-weight:700;color:var(--navy)">Reuniões e Ações</h2><button class="btn btn-primary btn-sm" onclick="openNM()"><i class="ti ti-plus"></i>Nova Reunião</button></div>
      <div id="mlist"></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="font-size:15px;font-weight:700;color:var(--navy)">Metas do Time</h2><button class="btn btn-primary btn-sm" onclick="openNG()"><i class="ti ti-plus"></i>Nova Meta</button></div>
      <div id="glist"></div>
    </div>
  </div>`;
  rML();rGL();
}
function rML(){
  const ml=document.getElementById('mlist');if(!ml)return;
  const sorted=[...S.meetings].sort((a,b)=>b.data.localeCompare(a.data));
  if(!sorted.length){ml.innerHTML=`<div class="card" style="padding:28px;text-align:center;color:var(--muted)">Nenhuma reunião registrada</div>`;return;}
  const stC={'Pendente':'pend','Em andamento':'prog','Concluído':'done'};
  ml.innerHTML=sorted.map(m=>{
    const acoes=m.acoes||[];const allD=acoes.length>0&&acoes.every(a=>a.st==='Concluído');
    const dnCnt=acoes.filter(a=>a.st==='Concluído').length;
    const isOpen=m.open!==false&&!allD||m.open===true;
    return `<div class="mcard">
      <div class="mchdr">
        <div class="minfo" onclick="togM('${m.id}')">
          <div style="font-size:11px;color:${OG};font-weight:700;margin-bottom:2px"><i class="ti ti-calendar"></i> ${df(m.data)}</div>
          <div style="font-size:14px;font-weight:700;color:var(--navy)">${m.titulo}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px"><i class="ti ti-users"></i> ${(m.presentes||[]).join(', ')}</div>
        </div>
        <div class="macts">
          ${allD?'<span class="bdone"><i class="ti ti-check"></i> Completo</span>':acoes.length?`<span class="bpart">${dnCnt}/${acoes.length}</span>`:''}
          <button class="ibtn" onclick="openEM('${m.id}')" title="Editar reunião"><i class="ti ti-edit"></i></button>
          <button class="ibtn del" onclick="dlM('${m.id}')" title="Excluir reunião"><i class="ti ti-trash"></i></button>
          <button class="ibtn" onclick="togM('${m.id}')" title="${isOpen?'Recolher':'Expandir'}"><i class="ti ti-chevron-${isOpen?'up':'down'}"></i></button>
        </div>
      </div>
      ${isOpen?`<div class="mbody">
        <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Ações (${dnCnt}/${acoes.length})</div>
        ${acoes.map(a=>`<div class="arow">
          <input type="checkbox"${a.st==='Concluído'?' checked':''} onchange="togA('${m.id}','${a.id}',this.checked)">
          <span class="adesc" style="${a.st==='Concluído'?'text-decoration:line-through;color:var(--muted)':''}">${a.desc}</span>
          <span class="aresp">${a.resp}</span>
          <span class="ast ${stC[a.st]||'pend'}">${a.st}</span>
        </div>`).join('')}
        ${!acoes.length?'<div style="font-size:12px;color:var(--muted)">Nenhuma ação</div>':''}
      </div>`:''}</div>`;
  }).join('');
}
function togM(id){const m=S.meetings.find(x=>x.id===id);if(!m)return;const allD=(m.acoes||[]).length>0&&(m.acoes||[]).every(a=>a.st==='Concluído');m.open=allD?(m.open===true?false:true):(m.open===false?true:false);sv('pgM',S.meetings);rML();}
function togA(mid,aid,done){const m=S.meetings.find(x=>x.id===mid);if(!m)return;const a=(m.acoes||[]).find(x=>x.id===aid);if(!a)return;a.st=done?'Concluído':'Pendente';if((m.acoes||[]).every(x=>x.st==='Concluído')){m.open=false;toast('Reunião concluída! 🎉');}sv('pgM',S.meetings);rML();}
function dlM(id){if(!confirm('Excluir reunião?'))return;S.meetings=S.meetings.filter(m=>m.id!==id);sv('pgM',S.meetings);toast('Reunião excluída');rML();}
function rGL(){
  const gl=document.getElementById('glist');if(!gl)return;
  gl.innerHTML=S.goals.map(g=>{
    const raw=g.inv?Math.max(0,(2*g.meta-g.atual)/g.meta*100):Math.min(100,(g.atual/g.meta)*100);
    const p=Math.max(0,Math.min(100,raw||0));
    const clr=g.inv?(g.atual<=g.meta?GR:RD):(p>=80?GR:p>=50?OG:RD);
    return `<div class="gcard"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <span style="font-size:13px;font-weight:700;color:var(--navy)">${g.titulo}</span>
      <div style="display:flex;gap:5px">
        <button class="ibtn btn-sm" onclick="openEG('${g.id}')" title="Editar meta"><i class="ti ti-edit"></i></button>
        <button class="ibtn del btn-sm" onclick="dlG('${g.id}')" title="Excluir meta"><i class="ti ti-trash"></i></button>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px"><span>Atual: <strong style="color:${clr}">${g.atual} ${g.uni}</strong></span><span>Meta: ${g.meta} ${g.uni}</span></div>
    <div class="gbar"><div class="gfill" style="width:${p}%;background:${clr}"></div></div>
    <div style="font-size:11px;color:var(--muted);margin-top:5px;font-weight:600">${g.per} · ${Math.round(p)}% da meta</div></div>`;
  }).join('');
}
// Meeting modal
function openNM(){S.editM=null;mkMM();}
function openEM(id){S.editM=S.meetings.find(m=>m.id===id)||null;mkMM();}

    <button class="btn btn-ghost btn-sm" style="margin-bottom:14px" onclick="addAR()"><i class="ti ti-plus"></i>Adicionar ação</button>
    <div class="mfooter"><button class="btn btn-ghost" onclick="clMM()">Cancelar</button><button class="btn btn-primary" onclick="svM()"><i class="ti ti-check"></i>Salvar</button></div>
  </div>`;
}
function addAR(){const al=document.getElementById('alist');if(!al)return;const d=document.createElement('div');d.style.cssText='display:grid;grid-template-columns:1fr 90px 120px 36px;gap:6px;margin-bottom:8px;align-items:center';d.innerHTML=`<input placeholder="Descrição" style="padding:8px 10px;border:2px solid var(--border);border-radius:8px;font-size:12px;font-family:Poppins,sans-serif;outline:none"><select style="padding:8px;border:2px solid var(--border);border-radius:8px;font-size:12px;font-family:Poppins,sans-serif;background:#fff">${CONS.map(c=>`<option>${c}</option>`).join('')}</select><select style="padding:8px;border:2px solid var(--border);border-radius:8px;font-size:12px;font-family:Poppins,sans-serif;background:#fff"><option>Pendente</option><option>Em andamento</option><option>Concluído</option></select><button class="ibtn del" onclick="this.closest('div').remove()" title="Remover"><i class="ti ti-x"></i></button>`;al.appendChild(d);}
function clMM(){const m=document.getElementById('mMod');if(m)m.remove();}
function svM(){
  const d=document.getElementById('mdt').value,t=document.getElementById('mti').value.trim();if(!d||!t){toast('Data e título obrigatórios',false);return;}
  const pres=[...document.querySelectorAll('.mpres:checked')].map(x=>x.value);
  const rows=document.querySelectorAll('#alist>div');
  const acoes=[...rows].map(r=>{const ins=r.querySelectorAll('input,select');return{id:uid(),desc:ins[0].value,resp:ins[1].value,st:ins[2].value};}).filter(a=>a.desc.trim());
  const meet={id:S.editM?S.editM.id:uid(),data:d,titulo:t,presentes:pres,acoes,open:true};
  if(S.editM){S.meetings=S.meetings.map(m=>m.id===meet.id?meet:m);}else{S.meetings.push(meet);}
  sv('pgM',S.meetings);clMM();toast(S.editM?'Reunião atualizada':'Reunião criada');rML();
}
// Goal modal
function openNG(){S.editG=null;mkGM();}
function openEG(id){S.editG=S.goals.find(g=>g.id===id)||null;mkGM();}
function dlG(id){if(!confirm('Excluir meta?'))return;S.goals=S.goals.filter(g=>g.id!==id);sv('pgG',S.goals);toast('Meta excluída');rGL();}
function mkGM(){
  const g=S.editG||{};let ov=document.getElementById('gMod');
  if(!ov){ov=document.createElement('div');ov.className='overlay';ov.id='gMod';ov.onclick=function(e){if(e.target===this)clGM();};document.body.appendChild(ov);}
  ov.innerHTML=`<div class="modal" style="max-width:420px"><div class="modal-h"><i class="ti ti-target" style="color:${OG}"></i>${g.id?'Editar Meta':'Nova Meta'}</div>
    <div class="fg"><label>Título*</label><input id="gti" value="${g.titulo||''}" placeholder="Ex: Clientes Ativos"></div>
    <div class="form-row"><div class="fg"><label>Meta</label><input id="gme" type="number" step="0.1" value="${g.meta||''}"></div><div class="fg"><label>Atual</label><input id="gat" type="number" step="0.1" value="${g.atual||''}"></div></div>
    <div class="form-row"><div class="fg"><label>Unidade</label><input id="gun" value="${g.uni||''}" placeholder="clientes, %, pts..."></div><div class="fg"><label>Período</label><input id="gpe" value="${g.per||''}" placeholder="Dez/2026"></div></div>
    <div class="fg"><label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;cursor:pointer;color:var(--text)"><input type="checkbox" id="gin"${g.inv?' checked':''} style="width:15px;height:15px">Inverso — menor = melhor (ex: churn)</label></div>
    <div class="mfooter"><button class="btn btn-ghost" onclick="clGM()">Cancelar</button><button class="btn btn-primary" onclick="svG()"><i class="ti ti-check"></i>Salvar</button></div>
  </div>`;
}
function clGM(){const m=document.getElementById('gMod');if(m)m.remove();}
function svG(){
  const t=document.getElementById('gti').value.trim();if(!t){toast('Título obrigatório',false);return;}
  const g={id:S.editG?S.editG.id:uid(),titulo:t,meta:+document.getElementById('gme').value||0,atual:+document.getElementById('gat').value||0,uni:document.getElementById('gun').value,per:document.getElementById('gpe').value,inv:document.getElementById('gin').checked};
  if(S.editG){S.goals=S.goals.map(x=>x.id===g.id?g:x);}else{S.goals.push(g);}
  sv('pgG',S.goals);clGM();toast(S.editG?'Meta atualizada':'Meta criada');rGL();
}

// ── REALTIME ──────────────────────────────────────────────
function setSyncDot(s){const d=document.getElementById('syncdot');if(!d)return;d.className='syncdot '+s;}
function setupRT(){
  SB.channel('pg-rt')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'kv_store'},({new:n})=>{
      if(!n?.key)return;
      const k=n.key,v=n.value,mc=document.getElementById('main');
      if(k==='clients'){
        S.clients=v;rSidebar();
        if(S.tab==='clientes')rClients(mc);
        else if(S.tab==='fluxo')rFluxo(mc);
        else if(S.tab==='dashboard'){dC();rDash(mc);}
        const p=document.getElementById('dpanel');if(p&&S.selC)rDP();
      }else if(k==='chk'){S.chk=v;if(S.selC)rDPBody();}
      else if(k==='repo'&&S.tab==='repositorio')rRepo(mc);
      else if(k==='meetings'&&S.tab==='time')rML();
      else if(k==='goals'&&S.tab==='time')rGL();
      if(k==='meetings'){S.meetings=v;}
      if(k==='repo'){S.repo=v;}
      if(k==='goals'){S.goals=v;}
      setSyncDot('ok');
    })
    .subscribe(st=>{
      if(st==='SUBSCRIBED')setSyncDot('ok');
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')setSyncDot('err');
    });
}

// ── INIT ──────────────────────────────────────────────────
async function init(){
  const loader=document.getElementById('pgLoader');
  const app=document.getElementById('pgApp');
  try{
    const existing=await sbG('clients',null);
    if(existing===null){
      // Primeira execução — popular banco com dados iniciais
      await Promise.all([
        sbS('clients',IC),sbS('chk',{}),sbS('repo',IR),
        sbS('meetings',IM),sbS('goals',IG),sbS('chkver',CHK_VER)
      ]);
      S.clients=IC;S.chk={};S.repo=IR;S.meetings=IM;S.goals=IG;
    }else{
      S.clients=existing;
      const cv=await sbG('chkver','0');
      const chkData=await sbG('chk',{});
      if(cv!==CHK_VER){S.chk={};await sbS('chk',{});await sbS('chkver',CHK_VER);}
      else{S.chk=chkData;}
      S.repo=await sbG('repo',IR);
      S.meetings=await sbG('meetings',IM);
      S.goals=await sbG('goals',IG);
    }
    setupRT();
    loader.style.display='none';
    app.style.display='flex';
    render();
  }catch(err){
    console.error('Init error:',err);
    loader.innerHTML=`<div class="err-box">
      <i class="ti ti-wifi-off"></i>
      <h3>Erro de conexão com o banco</h3>
      <p>Verifique se o SQL foi executado no Supabase.</p>
      <button onclick="location.reload()" style="margin-top:16px;padding:10px 22px;background:#E8641A;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:Poppins,sans-serif;font-weight:700;font-size:13px">↺ Tentar novamente</button>
    </div>`;
  }
}
init();
</script>
